apiVersion: v1
kind: ConfigMap
metadata:
  name: k6-script
data:
  script.js: |
    import http from 'k6/http';
    import { check } from 'k6';
    export const options = { vus: 80, duration: '30s' };
    export default function () {
      const seat = `LOAD-${__VU}-${__ITER}`;
      const r = http.post('http://api-gateway:3001/api/comprar', JSON.stringify({seatId: seat, amount: 25, email: 'demo@example.com'}), {headers: {'Content-Type': 'application/json'}});
      check(r, { 'respuesta controlada': x => [201, 503, 504].includes(x.status) });
    }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: k6-load
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: k6
          image: grafana/k6:0.49.0
          args: [run, /scripts/script.js]
          volumeMounts:
            - {name: script, mountPath: /scripts}
      volumes:
        - name: script
          configMap: {name: k6-script}
