apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventario
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: inventario
  template:
    metadata:
      labels:
        app: inventario
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - inventario
              topologyKey: kubernetes.io/hostname
      containers:
        - name: inventario
          image: inventario:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3003
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 300m, memory: 192Mi}
          readinessProbe:
            httpGet: {path: /readyz, port: 3003}
            initialDelaySeconds: 2
          livenessProbe:
            httpGet: {path: /healthz, port: 3003}
            initialDelaySeconds: 5
          env:
            - name: POSTGRES_HOST
              value: postgres
            - name: POSTGRES_PORT
              value: "5432"
---
apiVersion: v1
kind: Service
metadata:
  name: inventario
spec:
  type: ClusterIP
  selector:
    app: inventario
  ports:
    - port: 3003
      targetPort: 3003
      protocol: TCP
