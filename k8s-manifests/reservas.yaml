apiVersion: apps/v1
kind: Deployment
metadata:
  name: reservas
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: reservas
  template:
    metadata:
      labels:
        app: reservas
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - reservas
              topologyKey: kubernetes.io/hostname
      containers:
        - name: reservas
          image: reservas:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3002
          resources:
            requests: {cpu: 100m, memory: 96Mi}
            limits: {cpu: 500m, memory: 256Mi}
          readinessProbe:
            httpGet: {path: /readyz, port: 3002}
            initialDelaySeconds: 2
          livenessProbe:
            httpGet: {path: /healthz, port: 3002}
            initialDelaySeconds: 5
          env:
            - name: INVENTARIO_URL
              value: http://inventario:3003
            - name: PAGOS_URL
              value: http://pagos:3004
            - name: NOTIFICACIONES_URL
              value: http://notificaciones:3005
            - name: POSTGRES_HOST
              value: postgres
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: practica_tolerancia
            - name: POSTGRES_USER
              value: appuser
            - name: POSTGRES_PASSWORD
              value: apppassword
---
apiVersion: v1
kind: Service
metadata:
  name: reservas
spec:
  type: ClusterIP
  selector:
    app: reservas
  ports:
    - port: 3002
      targetPort: 3002
      protocol: TCP
