apiVersion: apps/v1
kind: Deployment
metadata:
  name: pagos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pagos
  template:
    metadata:
      labels:
        app: pagos
    spec:
      containers:
        - name: pagos
          image: pagos:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3004
          env:
            - name: POSTGRES_HOST
              value: postgres
            - name: POSTGRES_PORT
              value: "5432"
---
apiVersion: v1
kind: Service
metadata:
  name: pagos
spec:
  type: ClusterIP
  selector:
    app: pagos
  ports:
    - port: 3004
      targetPort: 3004
      protocol: TCP
