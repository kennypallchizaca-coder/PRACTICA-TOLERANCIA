apiVersion: apps/v1
kind: Deployment
metadata:
  name: pagos
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pagos
  template:
    metadata:
      labels:
        app: pagos
    spec:
      containers:
        - name: pagos
          image: pagos:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3004
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 192Mi}
          readinessProbe:
            httpGet: {path: /readyz, port: 3004}
            initialDelaySeconds: 2
          livenessProbe:
            httpGet: {path: /healthz, port: 3004}
            initialDelaySeconds: 5
          env:
            - name: POSTGRES_HOST
              value: postgres
            - name: POSTGRES_PORT
              value: "5432"
---
apiVersion: v1
kind: Service
metadata:
  name: pagos
spec:
  type: ClusterIP
  selector:
    app: pagos
  ports:
    - port: 3004
      targetPort: 3004
      protocol: TCP
