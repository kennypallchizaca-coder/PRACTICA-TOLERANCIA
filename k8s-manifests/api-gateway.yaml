apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          env:
            - name: RESERVAS_URL
              value: http://reservas:3002
            - name: INVENTARIO_URL
              value: http://inventario:3003
            - name: PAGOS_URL
              value: http://pagos:3004
            - name: NOTIFICACIONES_URL
              value: http://notificaciones:3005
            - name: POSTGRES_HOST
              value: postgres
            - name: POSTGRES_PORT
              value: "5432"
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  type: NodePort
  selector:
    app: api-gateway
  ports:
    - port: 3001
      targetPort: 3001
      nodePort: 30001
      protocol: TCP
